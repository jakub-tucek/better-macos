<body>
<header class="caption"><span><b>Fix macOS</b> / Minimal design study</span><span class="detail" id="direction"></span><span class="study-label">Mock data · no system changes</span></header>
<main id="app" aria-label="Settings design preview"></main>
<div class="notice" role="status" id="notice"></div>
<nav class="switcher" aria-label="Design variation">
 <button class="arrow" id="previous" aria-label="Previous design">‹</button>
 <button data-variant="prism">01 Quiet</button><button data-variant="canvas">02 Open</button><button data-variant="studio">03 Compact</button>
 <button class="arrow" id="next" aria-label="Next design">›</button><span class="sep"></span>
 <button class="utility" id="theme" aria-label="Toggle dark appearance">◐ Theme</button>
 <button class="utility motion" id="motion" aria-pressed="false">Reduce motion</button>
</nav>
<output class="state" id="state"></output>
<script>
const variants=['prism','canvas','studio'];
const state={variant:variants.includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'prism',theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',reduceMotion:matchMedia('(prefers-reduced-motion: reduce)').matches,shortcuts:true,automatic:false,selected:'left',lastAction:'none'};
const icons={General:'⚙','Quick actions':'⊞',Displays:'▱','Sound & connections':'◖',Input:'⌘',System:'☷',Clipboard:'▣'};
const directions={prism:'01 / Quiet sidebar',canvas:'02 / Open layout',studio:'03 / Compact inspector'};
const traffic=()=>'<div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>';
const brand=()=>'<div class="row brand-row"><span class="mark" aria-hidden="true">f</span><span class="brand">Fix macOS</span></div>';
const toggle=(key,label)=>`<button class="switch" role="switch" aria-label="${label}" aria-checked="${state[key]}" data-toggle="${key}"></button>`;
const action=(label,extra='')=>`<button class="btn ${extra}" data-action="${label}">${label}</button>`;
const nav=()=>`<div class="nav-list">${Object.entries(icons).map(([name,icon])=>`<button class="nav-item ${name==='Displays'?'active':''}" ${name==='Displays'?'aria-current="page"':'disabled'}><span class="glyph" aria-hidden="true">${icon}</span><span>${name}</span></button>`).join('')}</div>`;
const topology=()=>`<div class="topology" aria-label="Sample arrangement: Studio Display with MacBook Pro on the right"><div class="screen large"><b>Studio Display</b><span>Main display · 2560 × 1440</span></div><div class="screen small-screen"><b>MacBook Pro</b><span>Built-in display</span></div></div>`;
const shortcutData=[['left','Left half','⌃⌥←'],['right','Right half','⌃⌥→'],['max','Maximize','⌃⌥↩'],['center','Center','⌃⌥C']];
const shortcuts=(list=false)=>`<div class="${list?'list-shortcuts':'shortcut-grid'}">${shortcutData.map(([id,label,key])=>`<button class="shortcut ${state.selected===id?'selected':''}" data-shortcut="${id}" aria-label="Preview ${label}" aria-pressed="${state.selected===id}"><span class="mini-window ${id}" aria-hidden="true"></span><span class="shortcut-label">${label}</span><kbd class="key">${key}</kbd></button>`).join('')}</div>`;
const workspace=(name,detail)=>`<div class="workspace"><div class="workspace-thumb" aria-hidden="true"><i></i><i></i></div><div class="grow"><b>${name}</b><p>${detail}</p></div><button class="btn" data-action="Restore ${name}" aria-label="Preview restoring ${name}">Restore</button></div>`;
function VariantPrism(){return `<div class="app-window prism enter"><aside class="sidebar">${traffic()}${brand()}${nav()}<div class="side-foot"><span class="dot"></span>Sample configuration<br><span style="display:block;margin-top:9px">Everything stays on your Mac.</span></div></aside><section class="content"><header class="page-head"><div><p class="eyebrow" style="margin:0 0 10px">Your workspace</p><h1>Displays & windows</h1><p>A little less arranging. A little more flow.</p></div><span class="pill">2 displays</span></header><div class="prism-grid"><section class="card display-card"><div class="display-copy"><p class="eyebrow">CONNECTED DISPLAYS</p><h2>Room for everything.</h2><p>Two screens, one workspace. Arrange displays to match your desk.</p>${action('Arrange displays','primary')}</div>${topology()}</section><section class="card"><div class="section-label"><h2>Window shortcuts</h2>${toggle('shortcuts','Window shortcuts')}</div><p class="muted small" style="margin-bottom:19px">Put the focused window where it belongs.</p>${shortcuts()}<div class="panel-foot"><span>Control + Option</span><button class="accent" data-action="All shortcuts">All shortcuts ↗</button></div></section><section class="card"><div class="section-label"><h2>Saved layouts</h2><button class="accent small" data-action="Save current layout">+ Save current</button></div>${workspace('Deep work','3 windows · 2 displays')}${workspace('Writing','2 windows · 1 display')}<div class="rule"></div><div class="toggle-row"><div><h3>Restore after reconnect</h3><p class="muted small">Return to your saved arrangement.</p></div>${toggle('automatic','Restore after reconnect')}</div></section></div></section></div>`}
function VariantCanvas(){return `<div class="app-window canvas enter"><header class="canvas-nav">${brand()}<nav class="canvas-links" aria-label="Sample section navigation"><span>General</span><span class="active" aria-current="page">Displays</span><span>Sound</span><span>Input</span><span>System</span></nav><span class="pill">Design study</span></header><header class="canvas-intro"><div><p class="eyebrow" style="margin-bottom:15px">01 / Displays & windows</p><h1>Space to do<br>your best work.</h1></div><p>Keep your screens in sync.<br>Bring every window back to its place.</p></header><div class="canvas-grid"><section><div class="canvas-stage"><div class="row between"><span class="eyebrow">Your desk</span><span class="small muted">2 connected</span></div>${topology()}<div class="row between" style="margin-top:18px"><span class="small muted">Main display on the left</span>${action('Arrange displays','primary')}</div></div><div class="display-info"><div><b>Studio Display</b><p>External · Main display</p></div><div><b>MacBook Pro</b><p>Built-in · Extended desktop</p></div></div><div class="section-label" style="margin-top:24px"><h2>Familiar layouts.</h2><button class="accent small" data-action="Save current layout">Save current ↗</button></div>${workspace('Deep work','3 windows across both displays')}${workspace('Writing','A quiet single-screen setup')}</section><section style="padding-top:5px"><div class="section-label"><h2>A shortcut to focus.</h2>${toggle('shortcuts','Window shortcuts')}</div><p class="muted small">Hold Control + Option.<br>Choose where your window goes.</p>${shortcuts(true)}<button class="accent small" style="padding:14px 0" data-action="All shortcuts">Explore all shortcuts ↗</button><div class="rule" style="margin:15px 0 25px"></div><p class="eyebrow" style="margin-bottom:14px">Make it automatic</p><div class="toggle-row"><div><h3>Pick up where you left off.</h3><p class="muted small" style="margin-top:7px;max-width:215px">Restore your saved layout when a display reconnects.</p></div>${toggle('automatic','Restore after reconnect')}</div><p class="muted small" style="margin-top:28px">Window controls need Accessibility access. Your saved layouts stay on this Mac.</p></section></div></div>`}
function VariantStudio(){return `<div class="app-window studio enter"><aside class="rail"><span class="mark" aria-label="Fix macOS">f</span><nav class="rail-nav" aria-label="Sample settings sections">${Object.entries(icons).map(([name,icon])=>`<button title="${name}" aria-label="${name}" ${name==='Displays'?'class="active" aria-current="page"':'disabled'}>${icon}</button>`).join('')}</nav></aside><section class="studio-main"><header class="studio-toolbar"><span class="brand">Workspace</span><div class="segmented" aria-label="Current preview: arrangement"><span class="active">Arrangement</span><span class="muted">Layouts</span></div><span class="grow"></span><span class="pill">2 displays</span></header><div class="studio-body"><section class="studio-stage"><div class="row between"><div><p class="eyebrow">Display arrangement</p><h2 style="margin-top:8px">Your desk, mapped.</h2></div>${action('Arrange','primary')}</div>${topology()}<div class="bottom-shelf"><div class="row between"><h3>Saved layouts</h3><button class="accent small" data-action="Save current layout">+ Save current</button></div>${workspace('Deep work','3 windows · 2 displays')}${workspace('Writing','2 windows · 1 display')}</div></section><aside class="inspector"><p class="eyebrow" style="margin-bottom:24px">Workspace controls</p><div class="section-label"><h3>Keyboard shortcuts</h3>${toggle('shortcuts','Window shortcuts')}</div><p class="muted small" style="margin-bottom:17px">Control + Option to move<br>the focused window.</p>${shortcuts()}<button class="accent small" style="padding:16px 0" data-action="All shortcuts">All shortcuts ↗</button><div class="rule"></div><div class="toggle-row"><h3>Automatic restore</h3>${toggle('automatic','Restore after reconnect')}</div><p class="small muted" style="margin-top:10px">Restore a saved layout after reconnecting your displays.</p><div class="rule"></div><p class="eyebrow">Current selection</p><h3 style="margin:12px 0 4px">Studio Display</h3><p class="small muted">Main display<br>2560 × 1440 points<br>Extended desktop</p></aside></div></section></div>`}
const renderers={prism:VariantPrism,canvas:VariantCanvas,studio:VariantStudio};
let noticeTimer;
function showNotice(text){const node=document.querySelector('#notice');node.textContent=text;node.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>node.classList.remove('show'),2600)}
function publish(){document.querySelector('#state').textContent=`PROTOTYPE · ${JSON.stringify(state)}`;console.info('Visual design prototype', {...state})}
function render(animate=true){document.body.classList.toggle('dark',state.theme==='dark');document.body.classList.toggle('reduce',state.reduceMotion);let html=renderers[state.variant]();const copy=[['A little less arranging. A little more flow.','Arrange screens and manage windows.'],['Room for everything.','Display arrangement'],['Two screens, one workspace. Arrange displays to match your desk.','Match your screens to your desk.'],['Space to do<br>your best work.','Displays & windows'],['Keep your screens in sync.<br>Bring every window back to its place.','Arrange screens. Restore windows.'],['Familiar layouts.','Saved layouts'],['A shortcut to focus.','Window shortcuts'],['Pick up where you left off.','Restore after reconnect'],['Your desk, mapped.','Display arrangement'],['Everything stays on your Mac.','Preview only']];for(const [from,to] of copy)html=html.replaceAll(from,to);document.querySelector('#app').innerHTML=html;if(!animate)document.querySelector('.app-window').classList.remove('enter');document.querySelector('#direction').textContent=directions[state.variant];document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===state.variant)));document.querySelector('#motion').setAttribute('aria-pressed',String(state.reduceMotion));document.querySelector('#theme').setAttribute('aria-pressed',String(state.theme==='dark'));publish()}
function setVariant(variant){state.variant=variant;state.lastAction='switch design';const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
function step(n){setVariant(variants[(variants.indexOf(state.variant)+n+variants.length)%variants.length])}
document.querySelector('#previous').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);
document.querySelectorAll('[data-variant]').forEach(button=>button.onclick=()=>setVariant(button.dataset.variant));
document.querySelector('#theme').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';state.lastAction='toggle appearance';render(false)};
document.querySelector('#motion').onclick=()=>{state.reduceMotion=!state.reduceMotion;state.lastAction='toggle reduced motion';render(false)};
document.querySelector('#app').addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.toggle){const key=button.dataset.toggle;state[key]=!state[key];state.lastAction=`preview ${key} ${state[key]?'on':'off'}`;button.setAttribute('aria-checked',String(state[key]));publish();showNotice('Preview only. No preferences or system settings changed.')}else if(button.dataset.shortcut){state.selected=button.dataset.shortcut;state.lastAction=`preview ${state.selected}`;document.querySelectorAll('[data-shortcut]').forEach(b=>{const selected=b.dataset.shortcut===state.selected;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))});publish();showNotice('Shortcut preview only. No windows moved.')}else if(button.dataset.action){state.lastAction=button.dataset.action;publish();showNotice(`${button.dataset.action} — preview only. No system action runs.`)}});
document.addEventListener('keydown',event=>{if(event.defaultPrevented||event.altKey||event.ctrlKey||event.metaKey||event.target.closest('input,textarea,select,[contenteditable=true],[role=switch]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();step(event.key==='ArrowLeft'?-1:1)}});
addEventListener('popstate',()=>{const next=new URLSearchParams(location.search).get('variant');if(variants.includes(next)){state.variant=next;render()}});
render();
</script>
</body></html>
